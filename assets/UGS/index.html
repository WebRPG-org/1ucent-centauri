<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Navigator</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .item { padding: 8px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        .item a { text-decoration: none; color: #0366d6; }
        .item a:hover { text-decoration: underline; }
        .icon { margin-right: 8px; font-weight: bold; }
        #back-btn { margin-bottom: 15px; display: inline-block; cursor: pointer; color: #0366d6; }
    </style>
</head>
<body>

    <h2>File Navigator</h2>
    <div id="back-btn" style="display: none;">⬅️ Back</div>
    <div id="explorer">Loading repository contents...</div>

    <script>
        // CONFIGURATION: Change these to match your repository
        const USERNAME = 'your-github-username';
        const REPO = 'your-repository-name';
        
        let currentPath = ''; 

        async function fetchDirectory(path = '') {
            const explorer = document.getElementById('explorer');
            const backBtn = document.getElementById('back-btn');
            explorer.innerHTML = 'Loading...';
            
            // Toggle the back button visibility
            backBtn.style.display = path ? 'block' : 'none';
            currentPath = path;

            const url = `https://github.com{USERNAME}/${REPO}/contents/${path}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch directory contents');
                const items = await response.json();
                
                explorer.innerHTML = '';
                
                // Separate and sort folders and files
                items.sort((a, b) => (b.type === 'dir') - (a.type === 'dir'));

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    
                    if (item.type === 'dir') {
                        div.innerHTML = `<span class="icon">📁</span><a href="#" onclick="fetchDirectory('${item.path}')">${item.name}</a>`;
                    } else {
                        // Links directly to the live GitHub Pages version of the file
                        const fileUrl = `https://${USERNAME}.github.io/${REPO}/${item.path}`;
                        div.innerHTML = `<span class="icon">📄</span><a href="${fileUrl}" target="_blank">${item.name}</a>`;
                    }
                    explorer.appendChild(div);
                });
            } catch (error) {
                explorer.innerHTML = `<p style="color: red;">Error: ${error.message}. Make sure your config is correct.</p>`;
            }
        }

        // Handle back button functionality
        document.getElementById('back-btn').addEventListener('click', () => {
            const parts = currentPath.split('/');
            parts.pop(); // Remove current folder
            fetchDirectory(parts.join('/'));
        });

        // Initial load
        fetchDirectory();
    </script>
</body>
</html>
