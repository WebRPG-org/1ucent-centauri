<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local File Navigator</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #tree { margin-top: 20px; background: white; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        ul { list-style-type: none; padding-left: 20px; }
        li { margin: 5px 0; }
        .folder { font-weight: bold; color: #333; cursor: pointer; }
        .file { color: #0066cc; cursor: pointer; }
        .file:hover, .folder:hover { text-decoration: underline; }
        #viewer { margin-top: 20px; padding: 15px; background: #fff; border-radius: 6px; border: 1px solid #ccc; min-height: 100px; }
    </style>
</head>
<body>

    <h1>Local File Navigator</h1>
    <button id="openBtn">Open Folder</button>
    
    <div id="tree">No folder selected.</div>
    <h3>File Preview:</h3>
    <div id="viewer">Select a file to view its contents.</div>

    <script>
        const openBtn = document.getElementById('openBtn');
        const treeDiv = document.getElementById('tree');
        const viewerDiv = document.getElementById('viewer');

        openBtn.addEventListener('click', async () => {
            try {
                const dirHandle = await window.showDirectoryPicker();
                treeDiv.innerHTML = '';
                const ul = document.createElement('ul');
                await buildTree(dirHandle, ul);
                treeDiv.appendChild(ul);
            } catch (err) {
                console.error(err);
            }
        });

        async function buildTree(dirHandle, parentElement) {
            for await (const entry of dirHandle.values()) {
                const li = document.createElement('li');
                
                if (entry.kind === 'directory') {
                    li.textContent = `📁 ${entry.name}`;
                    li.className = 'folder';
                    const subUl = document.createElement('ul');
                    subUl.style.display = 'none'; // Collapse by default
                    
                    li.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (subUl.childElementCount === 0) {
                            await buildTree(entry, subUl);
                        }
                        subUl.style.display = subUl.style.display === 'none' ? 'block' : 'none';
                    });
                    
                    li.appendChild(subUl);
                } else if (entry.kind === 'file') {
                    li.textContent = `📄 ${entry.name}`;
                    li.className = 'file';
                    
                    li.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const file = await entry.getFile();
                        const text = await file.text();
                        viewerDiv.textContent = text;
                    });
                }
                
                parentElement.appendChild(li);
            }
        }
    </script>
</body>
</html>
