<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centauri File Navigator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        h1 { font-size: 1.5rem; }
        #path { font-weight: bold; margin-bottom: 15px; color: #555; }
        ul { list-style: none; padding: 0; background: #fff; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        li { padding: 12px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        li:last-child { border-bottom: none; }
        a { text-decoration: none; color: #0066cc; display: flex; align-items: center; gap: 10px; }
        a:hover { text-decoration: underline; }
        .folder { color: #f39c12; font-weight: bold; }
        .file { color: #27ae60; }
        button { background: #eee; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #ddd; }
    </style>
</head>
<body>

    <h1>Centauri Navigator</h1>
    <div id="path">Current Path: /</div>
    <div id="back-container" style="margin-bottom: 10px;"></div>
    <ul id="file-list">Loading files...</ul>

    <script>
        const user = '1ucent';
        const repo = 'centauri';

        async function loadDirectory(path = '') {
            const listEl = document.getElementById('file-list');
            const pathEl = document.getElementById('path');
            const backEl = document.getElementById('back-container');
            
            pathEl.textContent = `Current Path: /${path}`;
            listEl.innerHTML = '<li>Loading...</li>';

            if (path) {
                const parentPath = path.split('/').slice(0, -1).join('/');
                backEl.innerHTML = `<button onclick="loadDirectory('${parentPath}')">⬅ Back</button>`;
            } else {
                backEl.innerHTML = '';
            }

            try {
                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`);
                if (!res.ok) throw new Error('Failed to fetch contents');
                const data = await res.json();

                listEl.innerHTML = '';
                
                if (data.length === 0) {
                    listEl.innerHTML = '<li>Folder is empty</li>';
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');

                    if (item.type === 'dir') {
                        a.innerHTML = `<span class="folder">📁</span> ${item.name}`;
                        a.href = '#';
                        a.onclick = (e) => {
                            e.preventDefault();
                            loadDirectory(item.path);
                        };
                    } else {
                        a.innerHTML = `<span class="file">📄</span> ${item.name}`;
                        // Opens file directly via raw or standard github pages URL
                        a.href = item.html_url; 
                        a.target = '_blank';
                    }

                    li.appendChild(a);
                    listEl.appendChild(li);
                });
            } catch (err) {
                listEl.innerHTML = `<li style="color: red;">Error loading directory contents.</li>`;
            }
        }

        loadDirectory();
    </script>
</body>
</html>
