<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centauri</title>
    
    <!-- Local favicon path -->
    <link id="favicon" rel="icon" type="image/png" href="assets/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Darker Grotesque', sans-serif;
            background: #ffffff;
            color: #111111;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center select-none">

    <div class="flex flex-col items-center w-full max-w-4xl mx-auto space-y-8">
        
        <div class="space-y-6">
            <h1 class="text-4xl md:text-[3.5rem] font-normal tracking-tight leading-tight text-neutral-900">
                Coming to Maryland.
            </h1>
            
            <div class="py-4">
                <span class="text-5xl md:text-7xl font-bold tracking-wider uppercase text-red-600">
                    Delayed to launch before 9/11/26
                </span>
            </div>

            <p class="text-3xl md:text-[2.75rem] font-normal text-neutral-900 leading-tight">
               We are experiencing difficulties! 
            </p>
        </div>

        <div class="pt-8 pb-4 flex items-center justify-center">
            <!-- Local banner path -->
            <img src="assets/banner.png" 
                 alt="Centauri Logo" 
                 class="h-12 md:h-16 object-contain">
        </div>

    </div>
</body>
</html>
